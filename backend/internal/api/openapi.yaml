                          total: { type: integer }

  /original/{id}/reparse:
    post:
      tags: [original, tasks]
      summary: 重新解析原著（异步）
      description: 用已保存的源文件重新切分章节；返回 202 与 task_id。
      parameters:
        - name: id
          in: path
          required: true
          description: 原著 ID
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/analysis:
    post:
      tags: [analysis]
      summary: 触发原著分析（异步）
      description: |
        按阶段分析原著。**AI 产出只进入待审核提案，不会直接改写原著数据**（规格书 §52）。
        阶段：chapter_summary / character_extract / world_extract / plot_extract。
      parameters:
        - name: id
          in: path
          required: true
          description: 原著 ID
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  type: string
                  enum: [chapter_summary, character_extract, world_extract, plot_extract]
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/proposals:
    get:
      tags: [analysis]
      summary: 分析提案列表
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        - name: stage
          in: query
          schema: { type: string, enum: [chapter_summary, character_extract, world_extract, plot_extract] }
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [chapter_summary, character, world, world_rule, location, faction, event, plot_arc]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProposalList"

  /original/{id}/analysis/summary:
    get:
      tags: [analysis]
      summary: 提案统计
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          pending: { type: integer, format: int64 }
