            application/octet-stream:
              schema: { type: string, format: binary }

components:
  responses:
    BadRequest:
      description: 参数不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Conflict:
      description: 资源冲突（例如该文章已存在原著）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
  schemas:
    Envelope:
      type: object
      required: [data, error, trace_id]
      properties:
        data:
          nullable: true
          description: 成功时的业务数据；失败时为 null
        error:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/APIError"
        trace_id:
          type: string
          description: 与响应头 X-Request-Id 一致
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: PROJECT_NOT_FOUND
        message:
          type: string
          example: 项目不存在
        details:
          type: object
          additionalProperties: true
          nullable: true
    Project:
      type: object
      required: [id, name, type, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200, example: 人间真相 }
        description: { type: string, example: 六个普通人的群像故事 }
        type:
          type: string
          enum: [ORIGINAL, CREATIVE]
          description: ORIGINAL=原著文章，CREATIVE=二创文章；创建后不可变更
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    ProjectCreateRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 200, example: 人间真相 }
        description: { type: string, example: 六个普通人的群像故事 }
        type: { type: string, enum: [ORIGINAL, CREATIVE], example: CREATIVE }
    ProjectUpdateRequest:
      type: object
      description: 缺省字段保持不变
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
    HealthReport:
      type: object
      required: [status, version, env, uptime_sec, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string, example: 0.1.0-dev }
        env: { type: string, example: development }
        uptime_sec: { type: integer, format: int64 }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, error, not_configured] }
              detail: { type: string }
    Original:
      type: object
      required: [id, project_id, title, source_type, status, char_count, chapter_count]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        title: { type: string, example: 暗涌 }
        author: { type: string, example: 某作者 }
        description: { type: string }
        source_type: { type: string, enum: [MANUAL, TXT, DOCX, PDF] }
        status: { type: string, enum: [DRAFT, PARSED, ANALYZED] }
        char_count: { type: integer, format: int64, description: 正文字数（按字符计） }
        chapter_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OriginalCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200, example: 暗涌 }
        author: { type: string, maxLength: 120, example: 某作者 }
        description: { type: string, example: 导入的原著简介 }
    OriginalImportResult:
      type: object
      required: [file_id, file_name, encoding, char_count, chapter_count]
      properties:
        file_id: { type: string, format: uuid }
        file_name: { type: string, example: 暗涌.txt }
        size_bytes: { type: integer, format: int64 }
        encoding: { type: string, example: GB18030, description: 实际识别到的编码 }
        char_count: { type: integer, format: int64 }
        chapter_count: { type: integer }
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/OriginalChapterBrief"
    OriginalChapterBrief:
      type: object
      required: [chapter_no, title, char_count]
      properties:
        chapter_no: { type: integer, minimum: 1 }
        title: { type: string, example: 第一章 初遇 }
        char_count: { type: integer }
        summary: { type: string }
    OriginalChapterList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OriginalChapterBrief"
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    OriginalChapterDetail:
      allOf:
        - $ref: "#/components/schemas/OriginalChapterBrief"
        - type: object
          required: [content]
          properties:
            content: { type: string }
            start_position: { type: integer, format: int64, description: 在解析后全文中的 UTF-8 字节起始偏移 }
            end_position: { type: integer, format: int64, description: 结束偏移（不含） }
    DNADimension:
      type: object
      required: [weight]
      properties:
        text: { type: string, description: 该维度的文字描述 }
        weight: { type: integer, minimum: 0, maximum: 100, description: 继承权重（0-100） }
    CharacterDNA:
      type: object
      description: 人物 DNA：每个维度一句描述 + 0-100 权重
      properties:
        personality: { $ref: "#/components/schemas/DNADimension" }
        values: { $ref: "#/components/schemas/DNADimension" }
        motivation: { $ref: "#/components/schemas/DNADimension" }
        behavior: { $ref: "#/components/schemas/DNADimension" }
        speech_style: { $ref: "#/components/schemas/DNADimension" }
        background: { $ref: "#/components/schemas/DNADimension" }
        ability: { $ref: "#/components/schemas/DNADimension" }
        decision_style: { $ref: "#/components/schemas/DNADimension" }
        conflict_response: { $ref: "#/components/schemas/DNADimension" }
        emotional_response: { $ref: "#/components/schemas/DNADimension" }
        relationship_pattern: { $ref: "#/components/schemas/DNADimension" }
    CharacterRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120, example: 林默 }
        aliases: { type: array, items: { type: string }, example: [小默] }
        role: { type: string, example: 主角 }
        gender: { type: string, example: 女 }
        age: { type: string, example: "24" }
        appearance: { type: string }
        personality: { type: string }
        motivation: { type: string }
        values: { type: string }
        fears: { type: string }
        desires: { type: string }
        behavior_patterns: { type: string }
        speech_style: { type: string }
        abilities: { type: string }
        first_appearance: { type: string }
        last_appearance: { type: string }
        dna: { $ref: "#/components/schemas/CharacterDNA" }
        importance: { type: integer, minimum: 1, maximum: 5, default: 3 }
        notes: { type: string }
    Character:
      allOf:
        - $ref: "#/components/schemas/CharacterRequest"
        - type: object
          required: [id, original_work_id, source, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            original_work_id: { type: string, format: uuid }
            source: { type: string, enum: [MANUAL, AI] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CharacterList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Character"
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    RelationshipRequest:
      type: object
      required: [source_character_id, target_character_id, relation_type]
      properties:
        source_character_id: { type: string, format: uuid }
        target_character_id: { type: string, format: uuid }
        relation_type:
          type: string
          enum: [family, friend, lover, enemy, mentor, student, colleague, rival, organization, other]
        strength: { type: integer, minimum: 0, maximum: 100, default: 50 }
        description: { type: string }
    RelationshipUpdateRequest:
      type: object
      properties:
        relation_type:
          type: string
          enum: [family, friend, lover, enemy, mentor, student, colleague, rival, organization, other]
        strength: { type: integer, minimum: 1, maximum: 100 }
        description: { type: string }
    Relationship:
      type: object
      required: [id, original_work_id, source_character_id, target_character_id, relation_type, strength]
      properties:
        id: { type: string, format: uuid }
        original_work_id: { type: string, format: uuid }
        source_character_id: { type: string, format: uuid }
        target_character_id: { type: string, format: uuid }
        relation_type:
          type: string
          enum: [family, friend, lover, enemy, mentor, student, colleague, rival, organization, other]
        strength: { type: integer, minimum: 0, maximum: 100 }
        description: { type: string }
        source: { type: string, enum: [MANUAL, AI] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RelationshipList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Relationship"
        total: { type: integer }
    WorldUpsertRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200, example: 九州 }
        description: { type: string, example: 架空大陆，灵力是唯一超自然力量 }
    World:
      type: object
      required: [id, original_work_id, rule_count, location_count, faction_count]
      properties:
        id: { type: string, format: uuid }
        original_work_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        rule_count: { type: integer }
        location_count: { type: integer }
        faction_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorldRuleRequest:
      type: object
      required: [name]
      properties:
        category: { type: string, example: 力量体系 }
        name: { type: string, maxLength: 200, example: 灵力不可凭空产生 }
        description: { type: string }
        importance: { type: integer, minimum: 1, maximum: 5, default: 3 }
    WorldRule:
      allOf:
        - $ref: "#/components/schemas/WorldRuleRequest"
        - type: object
          required: [id, world_id]
          properties:
            id: { type: string, format: uuid }
            world_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    WorldRuleList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorldRule"
        total: { type: integer }
    LocationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200, example: 青云城 }
        type: { type: string, example: 城市 }
        description: { type: string }
        parent_location_id: { type: string, format: uuid, nullable: true }
    Location:
      allOf:
        - $ref: "#/components/schemas/LocationRequest"
        - type: object
          required: [id, world_id]
          properties:
            id: { type: string, format: uuid }
            world_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    LocationList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        total: { type: integer }
    FactionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200, example: 天枢阁 }
        type: { type: string, example: 宗门 }
        description: { type: string }
        goals: { type: string, example: 垄断灵矿 }
        relationships: { type: string, example: 与玄冥教敌对 }
    Faction:
      allOf:
        - $ref: "#/components/schemas/FactionRequest"
        - type: object
          required: [id, world_id]
          properties:
            id: { type: string, format: uuid }
            world_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    FactionList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Faction"
        total: { type: integer }
    EventRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200, example: 母亲的意外 }
        description: { type: string }
        chapter_no: { type: integer, nullable: true, minimum: 1 }
        time_order: { type: integer, description: 手工排序号，越小越靠前 }
        participants: { type: array, items: { type: string, format: uuid } }
        location_id: { type: string, format: uuid, nullable: true }
        location_text: { type: string, example: 老糖厂 }
        consequences: { type: string, example: 林默决定回江城 }
        importance: { type: integer, minimum: 1, maximum: 5, default: 3 }
    Event:
      allOf:
        - $ref: "#/components/schemas/EventRequest"
        - type: object
          required: [id, original_work_id, source, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            original_work_id: { type: string, format: uuid }
            source: { type: string, enum: [MANUAL, AI] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    EventList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    TimelineItem:
      type: object
      required: [event_id]
      properties:
        event_id: { type: string, format: uuid }
        time_label: { type: string, example: 三年前·梅雨季 }
        duration: { type: string, example: 两天 }
    TimelineOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 数组顺序即时间线顺序
          items:
            $ref: "#/components/schemas/TimelineItem"
    TimelineEntry:
      allOf:
        - $ref: "#/components/schemas/TimelineItem"
        - type: object
          required: [sequence, event]
          properties:
            sequence: { type: integer, minimum: 1 }
            event:
              $ref: "#/components/schemas/Event"
    Timeline:
      type: object
      required: [id, name, entries]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEntry"
    PlotArcRequest:
      type: object
      required: [title]
      properties:
        type:
          type: string
          enum: [main, subplot, character_arc, relationship_arc, world_arc]
          default: main
        title: { type: string, maxLength: 200, example: 老城改造之争 }
        summary: { type: string }
        start_event_id: { type: string, format: uuid, nullable: true }
        end_event_id: { type: string, format: uuid, nullable: true }
    PlotArc:
      allOf:
        - $ref: "#/components/schemas/PlotArcRequest"
        - type: object
          required: [id, original_work_id, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            original_work_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PlotArcList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlotArc"
        total: { type: integer }
    ModelProviderRequest:
      type: object
      required: [name, provider, api_base, model_name]
      properties:
        name: { type: string, maxLength: 120, example: DeepSeek }
        provider: { type: string, enum: [OPENAI_COMPATIBLE, ANTHROPIC] }
        api_base: { type: string, example: https://api.deepseek.com/v1 }
        api_key: { type: string, description: 明文只在请求里出现，服务端加密存储 }
        model_name: { type: string, example: deepseek-chat }
        purpose: { type: string, enum: [chat, embedding, both], default: chat }
        temperature: { type: number, minimum: 0, maximum: 2, default: 0.7 }
        max_tokens: { type: integer, default: 4096 }
        timeout_sec: { type: integer, default: 120 }
        enabled: { type: boolean, default: true }
        is_default: { type: boolean, default: false }
        notes: { type: string }
    ModelProvider:
      allOf:
        - $ref: "#/components/schemas/ModelProviderRequest"
        - type: object
          required: [id, has_api_key, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            api_key: { type: string, readOnly: true, description: 永远不返回 }
            has_api_key: { type: boolean, description: 是否已保存密钥（不暴露任何密钥片段） }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ModelProviderList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelProvider"
        total: { type: integer }
    ModelProviderTest:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        model: { type: string }
        reply: { type: string }
        latency_ms: { type: integer, format: int64 }
        total_tokens: { type: integer }
        error_message: { type: string }
    PromptMeta:
      type: object
      required: [name, version, path]
      properties:
        name: { type: string, example: character_extract }
        version: { type: string, example: v1 }
        path: { type: string, example: character/character_extract.v1.md }
    TaskCreateRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, example: original_reparse }
        project_id: { type: string, format: uuid, nullable: true }
        work_id: { type: string, format: uuid, nullable: true }
        creative_work_id: { type: string, format: uuid, nullable: true }
        input: { type: object, additionalProperties: true, example: { work_id: "uuid" } }
        max_attempts: { type: integer, default: 3 }

    EntityVersion:
      type: object
      description: |
        人物 / 世界观 / 大纲的状态快照（规格书 §59）。
        恢复只回填快照里记录到的字段，不回滚删除动作。
      required: [id, entity_type, entity_id, creative_work_id, version_no, created_at]
      properties:
        id: { type: string, format: uuid }
        entity_type:
          type: string
          enum: [creative_character, creative_world, creative_outline]
        entity_id: { type: string, format: uuid }
        creative_work_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        payload:
          type: object
          additionalProperties: true
          description: 仅详情接口返回；列表接口不带，避免一次拉回几十份快照
        note: { type: string, example: "作者修改人物" }
        created_at: { type: string, format: date-time }
    Task:
      allOf:
        - $ref: "#/components/schemas/TaskCreateRequest"
        - type: object
          required: [id, status, progress, attempts]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [PENDING, RUNNING, PAUSED, COMPLETED, FAILED, CANCELLED] }
            progress: { type: integer, minimum: 0, maximum: 100 }
            progress_message: { type: string, example: "写入章节" }
            output: { type: object, additionalProperties: true }
            error: { type: string }
            attempts: { type: integer }
            created_at: { type: string, format: date-time }
            started_at: { type: string, format: date-time, nullable: true }
            finished_at: { type: string, format: date-time, nullable: true }
            updated_at: { type: string, format: date-time }
    TaskList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    Proposal:
      type: object
      required: [id, work_id, stage, entity_type, status, payload]
      properties:
        id: { type: string, format: uuid }
        work_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid, nullable: true }
        stage: { type: string, enum: [chapter_summary, character_extract, world_extract, plot_extract] }
        entity_type:
          type: string
          enum: [chapter_summary, character, world, world_rule, location, faction, event, plot_arc]
        title: { type: string, example: 林默 }
        payload: { type: object, additionalProperties: true, description: 模型产出的结构化内容 }
        evidence: { type: string, description: 模型给出的原文依据 }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        review_note: { type: string }
        reviewed_at: { type: string, format: date-time, nullable: true }
        applied_id: { type: string, format: uuid, nullable: true, description: 通过后写入正式表的记录 ID }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProposalList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Proposal"
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    CreateCreativeRequest:
      type: object
      required: [project_id, title]
      properties:
        project_id: { type: string, format: uuid, description: 必须是 CREATIVE 类型文章 }
        title: { type: string, maxLength: 200, example: 暗涌·另一个结局 }
        description: { type: string }
    CreativeWork:
      type: object
      required: [id, project_id, original_work_id, title, status]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        original_work_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [DRAFT, WRITING, FINISHED] }
        divergence_point_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InheritanceWeights:
      type: object
      description: 各维度继承权重 0-100，0 表示不继承
      properties:
        personality: { type: integer, minimum: 0, maximum: 100, example: 90 }
        values: { type: integer, minimum: 0, maximum: 100, example: 80 }
        motivation: { type: integer, minimum: 0, maximum: 100, example: 70 }
        behavior: { type: integer, minimum: 0, maximum: 100, example: 60 }
        speech_style: { type: integer, minimum: 0, maximum: 100, example: 30 }
        background: { type: integer, minimum: 0, maximum: 100, example: 10 }
        ability: { type: integer, minimum: 0, maximum: 100, example: 0 }
        relationship_pattern: { type: integer, minimum: 0, maximum: 100, example: 50 }
    InheritCharacterRequest:
      type: object
      required: [source_character_id]
      properties:
        source_character_id: { type: string, format: uuid }
        name: { type: string, description: 留空沿用原著人物姓名 }
        description: { type: string }
        importance: { type: integer, minimum: 1, maximum: 5, default: 3 }
        weights: { $ref: "#/components/schemas/InheritanceWeights" }
    FuseSource:
      type: object
      required: [character_id, weight]
      properties:
        character_id: { type: string, format: uuid, description: 二创人物 ID }
        weight: { type: integer, minimum: 1, maximum: 100, example: 60 }
    FuseCharacterRequest:
      type: object
      required: [name, sources]
      properties:
        name: { type: string, example: 林述 }
        description: { type: string }
        importance: { type: integer, minimum: 1, maximum: 5 }
        sources:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/FuseSource" }
    InheritanceRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        source_character_id: { type: string, format: uuid }
        personality: { type: integer }
        values: { type: integer }
        motivation: { type: integer }
        behavior: { type: integer }
        speech_style: { type: integer }
        background: { type: integer }
        ability: { type: integer }
        relationship_pattern: { type: integer }
    CreativeCharacter:
      type: object
      required: [id, creative_work_id, name, source_type, dna]
      properties:
        id: { type: string, format: uuid }
        creative_work_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        source_type:
          type: string
          enum: [ORIGINAL_INHERITED, MODIFIED, FUSED, NEW]
        source_character_id: { type: string, format: uuid, nullable: true }
        dna: { $ref: "#/components/schemas/CharacterDNA" }
        fusion_sources:
          type: array
          items: { $ref: "#/components/schemas/FuseSource" }
        fusion_detail:
          type: array
          description: 每个 DNA 维度最终取自哪个来源
          items:
            type: object
            properties:
              dimension: { type: string }
              from_name: { type: string }
              from_id: { type: string, format: uuid }
              weight: { type: integer }
        importance: { type: integer, minimum: 1, maximum: 5 }
        is_locked: { type: boolean }
        rules:
          type: array
          items: { $ref: "#/components/schemas/InheritanceRule" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Mapping:
      type: object
      required: [id, creative_work_id, original_id, creative_id, mapping_type]
      properties:
        id: { type: string, format: uuid }
        creative_work_id: { type: string, format: uuid }
        original_type: { type: string, example: character }
        original_id: { type: string, format: uuid }
        creative_type: { type: string, example: creative_character }
        creative_id: { type: string, format: uuid }
        mapping_type:
          type: string
          enum: [INHERITED, MODIFIED, REPLACED, FUSED, REMOVED, NEW]
        description: { type: string }
        created_at: { type: string, format: date-time }
    CreativeWorldRuleRequest:
      type: object
      required: [name]
      properties:
        category: { type: string, example: 社会规则 }
        name: { type: string, example: 老城区的人情规则 }
        description: { type: string }
        importance: { type: integer, minimum: 1, maximum: 5, default: 3 }
        status: { type: string, enum: [INHERITED, MODIFIED, REMOVED, NEW] }
        source_rule_id: { type: string, format: uuid, nullable: true }
    CreativeWorldRule:
      allOf:
        - $ref: "#/components/schemas/CreativeWorldRuleRequest"
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
    CreativeWorld:
      type: object
      required: [creative_work_id, inheritance_mode, rules]
      properties:
        id: { type: string, format: uuid, nullable: true, description: 未建世界时为 null }
        creative_work_id: { type: string, format: uuid }
        source_world_id: { type: string, format: uuid, nullable: true }
        inheritance_mode: { type: string, enum: [FULL, PARTIAL, MODIFIED, NEW] }
        name: { type: string }
        description: { type: string }
        inherited_count: { type: integer }
        modified_count: { type: integer }
        removed_count: { type: integer }
        new_count: { type: integer }
        rules:
          type: array
          items: { $ref: "#/components/schemas/CreativeWorldRule" }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    DivergencePoint:
      type: object
      required: [id, creative_work_id]
      properties:
        id: { type: string, format: uuid }
        creative_work_id: { type: string, format: uuid }
        original_chapter_id: { type: string, format: uuid, nullable: true }
        original_event_id: { type: string, format: uuid, nullable: true }
        time_label: { type: string, example: 三年前·梅雨季 }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreativeTimelineItem:
      type: object
      required: [title]
      properties:
        source_original_event_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [INHERITED, MODIFIED, NEW, REMOVED] }
        time_label: { type: string }
        title: { type: string }
        description: { type: string }
    CreativeTimelineEvent:
      allOf:
        - $ref: "#/components/schemas/CreativeTimelineItem"
        - type: object
          required: [id, sequence]
          properties:
            id: { type: string, format: uuid }
            sequence: { type: integer, minimum: 1 }
    CreateChapterRequest:
      type: object
      required: [chapter_no, title]
      properties:
        volume_id: { type: string, format: uuid, nullable: true }
        chapter_no: { type: integer, minimum: 1 }
        title: { type: string, example: 旧信 }
        summary: { type: string }
        purpose: { type: string, description: 本章叙事目的 }
        conflict: { type: string }
        outcome: { type: string }
        content: { type: string }
    CreativeScene:
      type: object
      properties:
        sequence: { type: integer, default: 1 }
        title: { type: string }
        location: { type: string }
        characters: { type: array, items: { type: string } }
        purpose: { type: string }
        conflict: { type: string }
        emotional_goal: { type: string }
        content: { type: string }
    Outline:
      type: object
      description: 大纲（规格书 §27）：一份作品可以有多份大纲，version 由作者自己维护
      properties:
        id: { type: string, format: uuid }
        creative_work_id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string }
        version: { type: integer, minimum: 1 }
        source: { type: string, enum: [MANUAL, AI], description: MANUAL=作者手写，AI=采纳 AI 候选 }
        node_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OutlineNode:
      type: object
      description: 大纲节点：level 1=卷 2=节 3=章，children 为子节点
      properties:
        id: { type: string, format: uuid }
        outline_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        level: { type: integer, enum: [1, 2, 3] }
        level_name: { type: string, enum: [卷, 节, 章] }
        sequence: { type: integer }
        title: { type: string }
        summary: { type: string }
        purpose: { type: string }
        characters: { type: array, items: { type: string } }
        location: { type: string }
        conflict: { type: string }
        outcome: { type: string }
        children:
          type: array
          items: { $ref: "#/components/schemas/OutlineNode" }
    OutlineNodeInput:
      type: object
      description: 大纲节点入参（嵌套提交，深度即层级：第 1 层 = 卷）
      required: [title]
      properties:
        title: { type: string }
        summary: { type: string }
        purpose: { type: string }
        characters: { type: array, items: { type: string } }
        location: { type: string }
        conflict: { type: string }
        outcome: { type: string }
        children:
          type: array
          items: { $ref: "#/components/schemas/OutlineNodeInput" }
    CreateOutlineRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, example: 二创大纲 v1 }
        summary: { type: string }
        version: { type: integer, minimum: 1 }
        source: { type: string, enum: [MANUAL, AI] }
        nodes:
          type: array
          description: 为空则创建空大纲；非空则一次性写入整棵树
          items: { $ref: "#/components/schemas/OutlineNodeInput" }
