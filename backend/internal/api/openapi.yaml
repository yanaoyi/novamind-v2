  /proposals/{id}:
    get:
      tags: [analysis]
      summary: 提案详情
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Proposal"
        "404":
          $ref: "#/components/responses/NotFound"

  /proposals/{id}/approve:
    post:
      tags: [analysis]
      summary: 通过提案
      description: 作者确认后写入原著正式表；payload 可传修改后的内容（AI 结果允许作者修改）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payload: { type: object, additionalProperties: true, description: 作者修改后的内容 }
                note: { type: string }
      responses:
        "200":
          description: 已通过并写入
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Proposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /proposals/{id}/reject:
    post:
