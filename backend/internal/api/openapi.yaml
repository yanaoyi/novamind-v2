      summary: 已注册的任务类型
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { type: string } }
                          total: { type: integer }

  /original/{id}/reparse:
    post:
      tags: [original, tasks]
      summary: 重新解析原著（异步）
      description: 用已保存的源文件重新切分章节；返回 202 与 task_id。
      parameters:
        - name: id
          in: path
          required: true
          description: 原著 ID
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  responses:
    BadRequest:
      description: 参数不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Conflict:
      description: 资源冲突（例如该工程已存在原著）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
  schemas:
    Envelope:
      type: object
      required: [data, error, trace_id]
      properties:
        data:
          nullable: true
          description: 成功时的业务数据；失败时为 null
        error:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/APIError"
        trace_id:
          type: string
          description: 与响应头 X-Request-Id 一致
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: PROJECT_NOT_FOUND
        message:
          type: string
          example: 项目不存在
        details:
          type: object
          additionalProperties: true
          nullable: true
    Project:
      type: object
      required: [id, name, type, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200, example: 人间真相 }
        description: { type: string, example: 六个普通人的群像故事 }
        type:
          type: string
          enum: [ORIGINAL, CREATIVE]
          description: ORIGINAL=原著工程，CREATIVE=二创工程；创建后不可变更
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    ProjectCreateRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 200, example: 人间真相 }
        description: { type: string, example: 六个普通人的群像故事 }
        type: { type: string, enum: [ORIGINAL, CREATIVE], example: CREATIVE }
    ProjectUpdateRequest:
      type: object
      description: 缺省字段保持不变
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
    HealthReport:
      type: object
      required: [status, version, env, uptime_sec, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string, example: 0.1.0-dev }
        env: { type: string, example: development }
        uptime_sec: { type: integer, format: int64 }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, error, not_configured] }
              detail: { type: string }
    Original:
      type: object
      required: [id, project_id, title, source_type, status, char_count, chapter_count]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        title: { type: string, example: 暗涌 }
        author: { type: string, example: 某作者 }
        description: { type: string }
        source_type: { type: string, enum: [MANUAL, TXT, DOCX, PDF] }
        status: { type: string, enum: [DRAFT, PARSED, ANALYZED] }
        char_count: { type: integer, format: int64, description: 正文字数（按字符计） }
        chapter_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OriginalCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200, example: 暗涌 }
        author: { type: string, maxLength: 120, example: 某作者 }
        description: { type: string, example: 导入的原著简介 }
    OriginalImportResult:
      type: object
      required: [file_id, file_name, encoding, char_count, chapter_count]
      properties:
        file_id: { type: string, format: uuid }
        file_name: { type: string, example: 暗涌.txt }
        size_bytes: { type: integer, format: int64 }
        encoding: { type: string, example: GB18030, description: 实际识别到的编码 }
        char_count: { type: integer, format: int64 }
        chapter_count: { type: integer }
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/OriginalChapterBrief"
    OriginalChapterBrief:
      type: object
      required: [chapter_no, title, char_count]
      properties:
        chapter_no: { type: integer, minimum: 1 }
        title: { type: string, example: 第一章 初遇 }
        char_count: { type: integer }
        summary: { type: string }
    OriginalChapterList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OriginalChapterBrief"
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    OriginalChapterDetail:
      allOf:
        - $ref: "#/components/schemas/OriginalChapterBrief"
        - type: object
          required: [content]
          properties:
            content: { type: string }
            start_position: { type: integer, format: int64, description: 在解析后全文中的 UTF-8 字节起始偏移 }
            end_position: { type: integer, format: int64, description: 结束偏移（不含） }
    DNADimension:
      type: object
      required: [weight]
      properties:
        text: { type: string, description: 该维度的文字描述 }
        weight: { type: integer, minimum: 0, maximum: 100, description: 继承权重（0-100） }
    CharacterDNA:
      type: object
      description: 人物 DNA：每个维度一句描述 + 0-100 权重
      properties:
        personality: { $ref: "#/components/schemas/DNADimension" }
        values: { $ref: "#/components/schemas/DNADimension" }
        motivation: { $ref: "#/components/schemas/DNADimension" }
        behavior: { $ref: "#/components/schemas/DNADimension" }
        speech_style: { $ref: "#/components/schemas/DNADimension" }
        background: { $ref: "#/components/schemas/DNADimension" }
        ability: { $ref: "#/components/schemas/DNADimension" }
        decision_style: { $ref: "#/components/schemas/DNADimension" }
        conflict_response: { $ref: "#/components/schemas/DNADimension" }
        emotional_response: { $ref: "#/components/schemas/DNADimension" }
        relationship_pattern: { $ref: "#/components/schemas/DNADimension" }
    CharacterRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120, example: 林默 }
        aliases: { type: array, items: { type: string }, example: [小默] }
        role: { type: string, example: 主角 }
        gender: { type: string, example: 女 }
        age: { type: string, example: "24" }
        appearance: { type: string }
        personality: { type: string }
        motivation: { type: string }
        values: { type: string }
        fears: { type: string }
        desires: { type: string }
        behavior_patterns: { type: string }
        speech_style: { type: string }
        abilities: { type: string }
        first_appearance: { type: string }
        last_appearance: { type: string }
        dna: { $ref: "#/components/schemas/CharacterDNA" }
        importance: { type: integer, minimum: 1, maximum: 5, default: 3 }
        notes: { type: string }
    Character:
      allOf:
        - $ref: "#/components/schemas/CharacterRequest"
        - type: object
          required: [id, original_work_id, source, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            original_work_id: { type: string, format: uuid }
            source: { type: string, enum: [MANUAL, AI] }
