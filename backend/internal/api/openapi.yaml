                        $ref: "#/components/schemas/Timeline"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [timeline]
      summary: 设置时间线顺序
      description: 整体替换时间线条目（幂等）：传入顺序即最终顺序，未传入的事件会被移出时间线。
