  /tasks:
    get:
      tags: [tasks]
      summary: 任务列表
      parameters:
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
        - name: work_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, RUNNING, PAUSED, COMPLETED, FAILED, CANCELLED] }
        - name: type
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20, maximum: 200 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TaskList"
    post:
      tags: [tasks]
      summary: 手工入队任务
      description: 调试与扩展用；返回 202 与 task_id，进度请轮询 GET /tasks/{id}。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tasks/{id}:
    get:
      tags: [tasks]
      summary: 任务详情
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks/{id}/cancel:
    post:
      tags: [tasks]
      summary: 取消任务
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 已取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /tasks/{id}/retry:
    post:
      tags: [tasks]
      summary: 重试任务
      description: 仅 FAILED / CANCELLED 状态可重试；会清零尝试次数并重新排队。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 已重新排队
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /task-types:
