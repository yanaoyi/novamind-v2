openapi: 3.0.3
info:
  title: NovaMind API
  version: 0.1.0
  description: |
    NovaMind V2 后端 API。所有响应统一为 `{ data, error, trace_id }`：
    - 成功：`data` 有值、`error` 为 null
    - 失败：`data` 为 null、`error` 含 `code` / `message`
    `trace_id` 与响应头 `X-Request-Id` 一致，可用于排查日志。
servers:
  - url: /api/v1
    description: 当前服务
tags:
  - name: system
    description: 系统与健康检查
  - name: projects
    description: 文章管理（原著 / 二创）
paths:
  /openapi.yaml:
    get:
      tags: [system]
      summary: OpenAPI 规范
      description: 返回本服务的 OpenAPI 3.0 规范；Swagger UI 位于 `/swagger/index.html`。
      responses:
        "200":
          description: 规范文件（YAML）
          content:
            application/yaml:
              schema:
                type: string

  /health:
    get:
      tags: [system]
      summary: 健康检查
      description: 返回服务状态与各依赖（PostgreSQL / Redis）的真实连通性。
      responses:
        "200":
          description: 全部依赖正常
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthReport"
        "503":
          description: 存在不健康的依赖（degraded）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /projects:
    get:
      tags: [projects]
      summary: 文章列表
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: type
          in: query
          schema: { type: string, enum: [ORIGINAL, CREATIVE] }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        - name: keyword
          in: query
          description: 按名称模糊匹配
          schema: { type: string }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [projects]
      summary: 创建文章
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [projects]
      summary: 文章详情
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [projects]
      summary: 更新文章
      description: 更新名称 / 简介 / 状态。文章类型（type）创建后不可变更。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [projects]
      summary: 删除文章
      description: 软删除（写 deleted_at），不物理删除数据。
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/original:
    post:
      tags: [original]
      summary: 创建原著
      description: 为指定文章创建原著。文章必须是 ORIGINAL 类型，且一个文章只能有一部原著。
      parameters:
        - name: id
          in: path
          required: true
          description: 文章 ID
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OriginalCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Original"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /original/{id}:
    get:
      tags: [original]
      summary: 原著详情
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Original"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/import:
    post:
      tags: [original]
      summary: 导入原著正文
      description: |
        上传 txt / docx 原文：自动探测编码（UTF-8 / UTF-8 BOM / UTF-16 / GB18030 / Big5）、
        识别章节标题并入库。**重复导入会整体替换该原著的章节**（幂等，不会重复累积）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 原著文件（.txt / .docx）
      responses:
        "200":
          description: 导入成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OriginalImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/chapters:
    get:
      tags: [original]
      summary: 章节目录
      description: 返回章节目录（不含正文），按章节号升序。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OriginalChapterList"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/chapters/{no}:
    get:
      tags: [original]
      summary: 章节正文
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: no
          in: path
          required: true
          description: 章节序号（从 1 开始）
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OriginalChapterDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/characters:
    parameters:
      - name: id
        in: path
        required: true
        description: 原著 ID
        schema: { type: string, format: uuid }
    get:
      tags: [characters]
      summary: 人物列表
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: keyword
          in: query
          description: 按姓名/角色模糊搜索
          schema: { type: string }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CharacterList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [characters]
      summary: 新增人物
      description: 同原著内姓名唯一；dna 各维度权重需在 0-100。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /characters/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [characters]
      summary: 人物详情
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Character"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [characters]
      summary: 更新人物
      description: 全量覆盖式更新：未提交的字段会被置空，客户端应回传完整对象。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [characters]
      summary: 删除人物
      description: 软删除；与其相关的人物关系一并删除。
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/relationships:
    parameters:
      - name: id
        in: path
        required: true
        description: 原著 ID
        schema: { type: string, format: uuid }
    get:
      tags: [characters]
      summary: 人物关系列表
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RelationshipList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [characters]
      summary: 新增人物关系
      description: 两端人物必须存在且属于同一部原著；同一对人物的同一关系类型不可重复。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Relationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /relationships/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [characters]
      summary: 更新人物关系
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Relationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [characters]
      summary: 删除人物关系
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/world:
    parameters:
      - name: id
        in: path
        required: true
        description: 原著 ID
        schema: { type: string, format: uuid }
    get:
      tags: [world]
      summary: 世界观概览
      description: 返回世界设定与规则/地点/势力数量；尚未创建世界时返回 404。
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/World"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [world]
      summary: 创建/更新世界观
      description: 一个原著只有一个世界；重复调用为更新（upsert）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorldUpsertRequest"
      responses:
        "200":
          description: 保存成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/World"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/rules:
    parameters:
      - name: id
        in: path
        required: true
        description: 原著 ID
        schema: { type: string, format: uuid }
    get:
      tags: [world]
      summary: 世界规则列表
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorldRuleList"
    post:
      tags: [world]
      summary: 新增世界规则
      description: 世界不存在时自动创建空世界；同一世界内规则名称唯一。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorldRuleRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorldRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /world-rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [world]
      summary: 更新世界规则
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorldRuleRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WorldRule"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [world]
      summary: 删除世界规则
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/locations:
    parameters:
      - name: id
        in: path
        required: true
        description: 原著 ID
        schema: { type: string, format: uuid }
    get:
      tags: [world]
      summary: 地点列表
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LocationList"
    post:
      tags: [world]
      summary: 新增地点
      description: parent_location_id 可选，用于建立「大陆 → 国家 → 城市」层级；同世界内名称唯一。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /locations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [world]
      summary: 更新地点
      description: 修改上级地点时会校验同世界且不形成环。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [world]
      summary: 删除地点
      description: 子地点的上级会被置空，不产生悬挂引用。
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/factions:
    parameters:
      - name: id
        in: path
        required: true
        description: 原著 ID
        schema: { type: string, format: uuid }
    get:
      tags: [world]
      summary: 势力列表
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/FactionList"
    post:
      tags: [world]
      summary: 新增势力
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactionRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Faction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /factions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [world]
      summary: 更新势力
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactionRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Faction"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [world]
      summary: 删除势力
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        description: 原著 ID
        schema: { type: string, format: uuid }
    get:
      tags: [events]
      summary: 事件列表
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EventList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [events]
      summary: 新增事件
      description: participants 与 location_id 必须属于同一部原著，否则 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"

