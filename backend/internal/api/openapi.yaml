openapi: 3.0.3
info:
  title: NovaMind API
  version: 0.1.0
  description: |
    NovaMind V2 后端 API。所有响应统一为 `{ data, error, trace_id }`：
    - 成功：`data` 有值、`error` 为 null
    - 失败：`data` 为 null、`error` 含 `code` / `message`
    `trace_id` 与响应头 `X-Request-Id` 一致，可用于排查日志。
servers:
  - url: /api/v1
    description: 当前服务
tags:
  - name: system
    description: 系统与健康检查
  - name: projects
    description: 工程管理（原著 / 二创）
paths:
  /openapi.yaml:
    get:
      tags: [system]
      summary: OpenAPI 规范
      description: 返回本服务的 OpenAPI 3.0 规范；Swagger UI 位于 `/swagger/index.html`。
      responses:
        "200":
          description: 规范文件（YAML）
          content:
            application/yaml:
              schema:
                type: string

  /health:
    get:
      tags: [system]
      summary: 健康检查
      description: 返回服务状态与各依赖（PostgreSQL / Redis）的真实连通性。
      responses:
        "200":
          description: 全部依赖正常
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthReport"
        "503":
          description: 存在不健康的依赖（degraded）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /projects:
    get:
      tags: [projects]
      summary: 工程列表
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: type
          in: query
          schema: { type: string, enum: [ORIGINAL, CREATIVE] }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        - name: keyword
          in: query
          description: 按名称模糊匹配
          schema: { type: string }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [projects]
      summary: 创建工程
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [projects]
      summary: 工程详情
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [projects]
      summary: 更新工程
      description: 更新名称 / 简介 / 状态。工程类型（type）创建后不可变更。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [projects]
      summary: 删除工程
      description: 软删除（写 deleted_at），不物理删除数据。
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/original:
    post:
      tags: [original]
      summary: 创建原著
      description: 为指定工程创建原著。工程必须是 ORIGINAL 类型，且一个工程只能有一部原著。
      parameters:
        - name: id
          in: path
          required: true
          description: 工程 ID
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OriginalCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Original"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /original/{id}:
    get:
      tags: [original]
      summary: 原著详情
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Original"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/import:
    post:
      tags: [original]
      summary: 导入原著正文
      description: |
        上传 txt / docx 原文：自动探测编码（UTF-8 / UTF-8 BOM / UTF-16 / GB18030 / Big5）、
        识别章节标题并入库。**重复导入会整体替换该原著的章节**（幂等，不会重复累积）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 原著文件（.txt / .docx）
      responses:
        "200":
          description: 导入成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OriginalImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/chapters:
    get:
      tags: [original]
      summary: 章节目录
      description: 返回章节目录（不含正文），按章节号升序。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OriginalChapterList"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/chapters/{no}:
    get:
      tags: [original]
      summary: 章节正文
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: no
          in: path
          required: true
          description: 章节序号（从 1 开始）
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OriginalChapterDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/characters:
    parameters:
      - name: id
        in: path
        required: true
        description: 原著 ID
        schema: { type: string, format: uuid }
    get:
      tags: [characters]
      summary: 人物列表
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: keyword
          in: query
          description: 按姓名/角色模糊搜索
          schema: { type: string }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CharacterList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [characters]
      summary: 新增人物
      description: 同原著内姓名唯一；dna 各维度权重需在 0-100。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /characters/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [characters]
      summary: 人物详情
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Character"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [characters]
      summary: 更新人物
      description: 全量覆盖式更新：未提交的字段会被置空，客户端应回传完整对象。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Character"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [characters]
      summary: 删除人物
      description: 软删除；与其相关的人物关系一并删除。
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
        "404":
          $ref: "#/components/responses/NotFound"

  /original/{id}/relationships:
    parameters:
      - name: id
        in: path
        required: true
        description: 原著 ID
        schema: { type: string, format: uuid }
    get:
      tags: [characters]
      summary: 人物关系列表
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RelationshipList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [characters]
      summary: 新增人物关系
      description: 两端人物必须存在且属于同一部原著；同一对人物的同一关系类型不可重复。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Relationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /relationships/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [characters]
      summary: 更新人物关系
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Relationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [characters]
      summary: 删除人物关系
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
        "404":
          $ref: "#/components/responses/NotFound"

components:
  responses:
    BadRequest:
      description: 参数不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Conflict:
      description: 资源冲突（例如该工程已存在原著）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
  schemas:
    Envelope:
      type: object
      required: [data, error, trace_id]
      properties:
        data:
          nullable: true
          description: 成功时的业务数据；失败时为 null
        error:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/APIError"
        trace_id:
          type: string
          description: 与响应头 X-Request-Id 一致
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: PROJECT_NOT_FOUND
        message:
          type: string
          example: 项目不存在
        details:
          type: object
          additionalProperties: true
          nullable: true
    Project:
      type: object
      required: [id, name, type, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200, example: 人间真相 }
        description: { type: string, example: 六个普通人的群像故事 }
        type:
          type: string
          enum: [ORIGINAL, CREATIVE]
          description: ORIGINAL=原著工程，CREATIVE=二创工程；创建后不可变更
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    ProjectCreateRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 200, example: 人间真相 }
        description: { type: string, example: 六个普通人的群像故事 }
        type: { type: string, enum: [ORIGINAL, CREATIVE], example: CREATIVE }
    ProjectUpdateRequest:
      type: object
      description: 缺省字段保持不变
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
    HealthReport:
      type: object
      required: [status, version, env, uptime_sec, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string, example: 0.1.0-dev }
        env: { type: string, example: development }
        uptime_sec: { type: integer, format: int64 }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, error, not_configured] }
              detail: { type: string }
    Original:
      type: object
      required: [id, project_id, title, source_type, status, char_count, chapter_count]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        title: { type: string, example: 暗涌 }
        author: { type: string, example: 某作者 }
        description: { type: string }
        source_type: { type: string, enum: [MANUAL, TXT, DOCX, PDF] }
        status: { type: string, enum: [DRAFT, PARSED, ANALYZED] }
        char_count: { type: integer, format: int64, description: 正文字数（按字符计） }
        chapter_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OriginalCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200, example: 暗涌 }
        author: { type: string, maxLength: 120, example: 某作者 }
        description: { type: string, example: 导入的原著简介 }
    OriginalImportResult:
      type: object
      required: [file_id, file_name, encoding, char_count, chapter_count]
      properties:
        file_id: { type: string, format: uuid }
        file_name: { type: string, example: 暗涌.txt }
        size_bytes: { type: integer, format: int64 }
        encoding: { type: string, example: GB18030, description: 实际识别到的编码 }
        char_count: { type: integer, format: int64 }
        chapter_count: { type: integer }
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/OriginalChapterBrief"
    OriginalChapterBrief:
      type: object
      required: [chapter_no, title, char_count]
      properties:
        chapter_no: { type: integer, minimum: 1 }
        title: { type: string, example: 第一章 初遇 }
        char_count: { type: integer }
        summary: { type: string }
    OriginalChapterList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OriginalChapterBrief"
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    OriginalChapterDetail:
      allOf:
        - $ref: "#/components/schemas/OriginalChapterBrief"
        - type: object
          required: [content]
          properties:
            content: { type: string }
            start_position: { type: integer, format: int64, description: 在解析后全文中的 UTF-8 字节起始偏移 }
            end_position: { type: integer, format: int64, description: 结束偏移（不含） }
    DNADimension:
      type: object
      required: [weight]
      properties:
        text: { type: string, description: 该维度的文字描述 }
        weight: { type: integer, minimum: 0, maximum: 100, description: 继承权重（0-100） }
    CharacterDNA:
      type: object
      description: 人物 DNA：每个维度一句描述 + 0-100 权重
      properties:
        personality: { $ref: "#/components/schemas/DNADimension" }
        values: { $ref: "#/components/schemas/DNADimension" }
        motivation: { $ref: "#/components/schemas/DNADimension" }
        behavior: { $ref: "#/components/schemas/DNADimension" }
        speech_style: { $ref: "#/components/schemas/DNADimension" }
        background: { $ref: "#/components/schemas/DNADimension" }
        ability: { $ref: "#/components/schemas/DNADimension" }
        decision_style: { $ref: "#/components/schemas/DNADimension" }
        conflict_response: { $ref: "#/components/schemas/DNADimension" }
        emotional_response: { $ref: "#/components/schemas/DNADimension" }
        relationship_pattern: { $ref: "#/components/schemas/DNADimension" }
    CharacterRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120, example: 林默 }
        aliases: { type: array, items: { type: string }, example: [小默] }
        role: { type: string, example: 主角 }
        gender: { type: string, example: 女 }
        age: { type: string, example: "24" }
        appearance: { type: string }
        personality: { type: string }
        motivation: { type: string }
        values: { type: string }
        fears: { type: string }
        desires: { type: string }
        behavior_patterns: { type: string }
        speech_style: { type: string }
        abilities: { type: string }
        first_appearance: { type: string }
        last_appearance: { type: string }
        dna: { $ref: "#/components/schemas/CharacterDNA" }
        importance: { type: integer, minimum: 1, maximum: 5, default: 3 }
        notes: { type: string }
    Character:
      allOf:
        - $ref: "#/components/schemas/CharacterRequest"
        - type: object
          required: [id, original_work_id, source, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            original_work_id: { type: string, format: uuid }
            source: { type: string, enum: [MANUAL, AI] }
