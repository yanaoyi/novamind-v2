    parameters:
      - name: id
        in: path
        required: true
        description: 原著 ID
        schema: { type: string, format: uuid }
    get:
      tags: [timeline]
      summary: 时间线详情
      description: 按顺序返回条目（含事件本体）；时间线不存在时自动创建空时间线。
